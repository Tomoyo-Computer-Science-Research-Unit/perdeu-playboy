name: Dados e site

# Todo dia: baixa de novo os arquivos oficiais (ISP, IBGE), regenera o snapshot e, se algum dado
# mudou, commita e publica o site construído no branch `site`. O droplet puxa esse branch
# (deploy/g0v/pull-site.sh). Um push em main com mudança no frontend também republica.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *" # 06:23 em Brasília
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/g0v/site/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ISP_DATA_BASE_URL: "http://www.ispdados.rj.gov.br/Arquivos"
      CHECK_DATA: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.CHECK_DATA == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: env.CHECK_DATA == 'true'
        working-directory: backend
        run: python -m pip install -e .

      # Sem cache dos arquivos brutos: baixar de novo é a checagem de arquivo novo.
      - name: Download official files and export the snapshot
        if: env.CHECK_DATA == 'true'
        working-directory: backend
        run: |
          python -m app.etl.export_static_frontend || {
            status=$?
            if [ -s ../frontend/lib/static-data.generated.json ]; then
              echo "Data export failed; keeping the committed static snapshot."
              exit 0
            fi
            exit "$status"
          }

      - name: Commit the snapshot when the data changed
        id: data
        if: env.CHECK_DATA == 'true'
        run: |
          python3 - <<'EOF'
          # generated_at muda a cada execução; só conta como mudança o resto do snapshot.
          import json, os, pathlib, subprocess
          files = ["frontend/lib/static-data.generated.json", "frontend/lib/static-geo.generated.json"]
          def body(text):
              data = json.loads(text)
              data.pop("generated_at", None)
              return data
          changed = []
          for f in files:
              new = pathlib.Path(f).read_text(encoding="utf-8")
              old = subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True, check=True).stdout
              if body(new) != body(old):
                  changed.append(f)
              else:
                  subprocess.run(["git", "checkout", "--", f], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
          print("changed:", changed or "nothing")
          EOF
          if [ "$(git status --porcelain -- frontend/lib)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/lib/static-data.generated.json frontend/lib/static-geo.generated.json
            git commit -m "Update static official-data snapshot"
            git push
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the site
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /perdeu-playboy
        run: npm run build

      - name: Publish to the site branch
        if: github.event_name != 'schedule' || steps.data.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rev="$(git rev-parse --short HEAD)"
          stage="$(mktemp -d)"
          cp -r deploy/g0v/site/. "$stage/"
          sed -i "s/VERSION/$rev/g" "$stage/index.html"
          mkdir -p "$stage/perdeu-playboy"
          cp -r frontend/out/. "$stage/perdeu-playboy/"
          cd "$stage"
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site from $rev"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          echo "published site from $rev"
