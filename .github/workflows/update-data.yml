name: Update static data

# Todo dia: baixa de novo os arquivos oficiais do Rio, regenera o snapshot e commita em main quando algum
# dado mudou (ignorando generated_at). As demais UFs (SSP-SP, Sinesp) são atualizadas só no servidor,
# pelo deploy/g0v/build-site.sh, que guarda o cache das respostas entre rodadas. Mantém o snapshot do repositório em dia para quem desenvolve;
# o site em produção é construído no próprio servidor (deploy/g0v/build-site.sh).

on:
  workflow_dispatch:
  schedule:
    - cron: "53 8 * * *" # 05:53 em Brasília, antes do build no servidor

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ISP_DATA_BASE_URL: "http://www.ispdados.rj.gov.br/Arquivos"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e .

      # Sem cache dos arquivos brutos: baixar de novo é a checagem de arquivo novo.
      - name: Download official files and export the snapshot
        working-directory: backend
        run: |
          python -m app.etl.export_static_frontend --uf RJ || {
            status=$?
            if [ -s ../frontend/data/rj/static-data.generated.json ]; then
              echo "Data export failed; keeping the committed static snapshot."
              exit 0
            fi
            exit "$status"
          }

      - name: Commit the snapshot when the data changed
        run: |
          python3 - <<'EOF'
          # generated_at muda a cada execução; só conta como mudança o resto do snapshot.
          import json, pathlib, subprocess
          files = ["frontend/data/rj/static-data.generated.json", "frontend/data/rj/static-geo.generated.json"]
          def body(text):
              data = json.loads(text)
              data.pop("generated_at", None)
              return data
          changed = []
          for f in files:
              new = pathlib.Path(f).read_text(encoding="utf-8")
              old = subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True, check=True).stdout
              if body(new) != body(old):
                  changed.append(f)
              else:
                  subprocess.run(["git", "checkout", "--", f], check=True)
          print("changed:", changed or "nothing")
          EOF
          if [ "$(git status --porcelain -- frontend/data/rj)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/data/rj/static-data.generated.json frontend/data/rj/static-geo.generated.json
            git commit -m "Update static official-data snapshot"
            git push
          fi
