name: Update static data

# Todo dia: baixa de novo os arquivos oficiais do Rio, regenera o snapshot e commita em main quando algum
# dado mudou (ignorando generated_at). As demais UFs (SSP-SP, Sinesp) são atualizadas só no servidor,
# pelo deploy/g0v/build-site.sh, que guarda o cache das respostas entre rodadas. Mantém o snapshot do repositório em dia para quem desenvolve;
# o site em produção é construído no próprio servidor (deploy/g0v/build-site.sh).

on:
  workflow_dispatch:
  schedule:
    - cron: "53 8 * * *" # 05:53 em Brasília, antes do build no servidor

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ISP_DATA_BASE_URL: "http://www.ispdados.rj.gov.br/Arquivos"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e .

      # Sem cache dos arquivos brutos: baixar de novo é a checagem de arquivo novo.
      - name: Download official files and export the snapshot
        working-directory: backend
        run: |
          python -m app.etl.export_static_frontend --uf RJ || {
            status=$?
            if [ -s ../frontend/data/rj/static-data.generated.json ]; then
              echo "Data export failed; keeping the committed static snapshot."
              exit 0
            fi
            exit "$status"
          }

      - name: Commit the snapshot when the data changed
        run: |
          python3 - <<'EOF'
          # Stage only real data changes under frontend/data/rj: generated_at changes on every
          # run and does not count. Deleted files are restored, never committed: this runner has
          # no Fogo Cruzado credentials, so the export drops the fc_* series that the server
          # (deploy/g0v/build-site.sh) produces with them.
          import json, pathlib, subprocess
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout
          def body(text):
              data = json.loads(text)
              if isinstance(data, dict):
                  data.pop("generated_at", None)
              return data
          staged, restored = [], []
          for line in git("status", "--porcelain", "--untracked-files=all", "--", "frontend/data/rj").splitlines():
              code, path = line[:2], line[3:]
              if "D" in code:
                  git("checkout", "--", path)
                  restored.append(path)
                  continue
              if not path.endswith(".json"):
                  continue
              new = pathlib.Path(path).read_text(encoding="utf-8")
              if code.strip() == "??":
                  staged.append(path)
                  continue
              old = git("show", f"HEAD:{path}")
              if body(new) != body(old):
                  staged.append(path)
              else:
                  git("checkout", "--", path)
          if staged:
              git("add", "--", *staged)
          print("changed:", staged or "nothing")
          print("restored (deleted by this export):", restored or "none")
          EOF
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update static official-data snapshot"
            git push
          else
            echo "No data changes to commit."
          fi
