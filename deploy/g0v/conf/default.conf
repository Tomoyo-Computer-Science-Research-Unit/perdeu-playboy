server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;  # atrás do Traefik o esquema é http; redireciona relativo

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Rotas antigas em inglês
    location ~ ^/perdeu-playboy/(dashboard)/?$ { return 301 /perdeu-playboy/; }
    location ~ ^/perdeu-playboy/trends(?:/(.*))?$ { return 301 /perdeu-playboy/series/$1; }
    location ~ ^/perdeu-playboy/map(?:/(.*))?$ { return 301 /perdeu-playboy/mapa/$1; }
    location ~ ^/perdeu-playboy/changes(?:/(.*))?$ { return 301 /perdeu-playboy/mudancas/$1; }
    location ~ ^/perdeu-playboy/governors(?:/(.*))?$ { return 301 /perdeu-playboy/mandatos/$1; }
    location ~ ^/perdeu-playboy/methodology(?:/(.*))?$ { return 301 /perdeu-playboy/metodologia/$1; }
    location ~ ^/perdeu-playboy/glossary(?:/(.*))?$ { return 301 /perdeu-playboy/glossario/$1; }
    location ~ ^/perdeu-playboy/sources(?:/(.*))?$ { return 301 /perdeu-playboy/fontes/$1; }

    # Escrito pelo build-site.sh a cada rodada; nunca em cache (nem na Cloudflare).
    location = /perdeu-playboy/status.json {
        add_header Cache-Control "no-store";
    }

    # Exports estáticos do Next.js (trailingSlash): /perdeu-playboy/series/ -> series/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/perdeu-playboy/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
