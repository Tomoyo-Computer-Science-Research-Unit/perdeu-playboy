server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;  # atrás do Traefik o esquema é http; redireciona relativo

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Exports estáticos do Next.js (trailingSlash): /perdeu-playboy/trends/ -> trends/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/perdeu-playboy/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
